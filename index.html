<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一击爆分 - 爆爽点击</title>
    <style>
        body { margin: 0; background: #0a001f; color: #fff; font-family: Arial; overflow: hidden; text-align: center; }
        canvas { display: block; margin: 0 auto; background: radial-gradient(#1a0033, #000); }
        #ui { position: absolute; top: 10px; left: 10px; font-size: 28px; text-shadow: 0 0 10px #ff0; }
        #combo { position: absolute; top: 50px; left: 10px; font-size: 24px; color: #0ff; text-shadow: 0 0 10px #0ff; }
        #message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 40px; color: #ff0; opacity: 0; transition: opacity 0.5s; text-shadow: 0 0 20px #f00; }
        button { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 12px 30px; font-size: 20px; background: #ff0; color: #000; border: none; border-radius: 50px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="ui">分数: 0</div>
    <div id="combo">Combo: 0x</div>
    <div id="message"></div>
    <canvas id="game" width="800" height="600"></canvas>
    <button onclick="restart()">重新开始</button>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let score = 0;
        let combo = 0;
        let balls = [];
        let particles = [];
        let timeStart = Date.now();

        class Ball {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.r = 18 + Math.random() * 22;
                this.color = ['#ff0088', '#00ffcc', '#ffff00', '#ff8800'][Math.floor(Math.random()*4)];
                this.vx = (Math.random() - 0.5) * 5;
                this.vy = (Math.random() - 0.5) * 5;
                this.value = Math.floor(10 + Math.random()*20);
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < this.r || this.x > canvas.width - this.r) this.vx *= -1;
                if (this.y < this.r || this.y > canvas.height - this.r) this.vy *= -1;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#000';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(this.value, this.x, this.y + 5);
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 12;
                this.vy = (Math.random() - 0.5) * 12;
                this.life = 40;
                this.color = color;
                this.size = 6 + Math.random() * 6;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.3;
                this.life--;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.life / 40;
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        function spawnBall() {
            balls.push(new Ball());
            if (balls.length > 20) balls.shift();
        }

        function createExplosion(x, y, color, count=30) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
            showMessage('BOOM!', x, y - 30);
        }

        function showMessage(txt, x=400, y=200) {
            const msg = document.getElementById('message');
            msg.textContent = txt;
            msg.style.left = x + 'px';
            msg.style.top = y + 'px';
            msg.style.opacity = 1;
            setTimeout(() => { msg.style.opacity = 0; }, 800);
        }

        function checkClick(x, y) {
            for (let i = balls.length - 1; i >= 0; i--) {
                let b = balls[i];
                let dx = b.x - x;
                let dy = b.y - y;
                if (dx*dx + dy*dy < b.r * b.r) {
                    balls.splice(i, 1);
                    score += b.value + combo * 8;
                    combo++;
                    updateUI();
                    createExplosion(b.x, b.y, b.color);
                    if (combo % 5 === 0) {
                        score += 100;
                        updateUI();
                        showMessage('+' + 100 + ' COMBO!', b.x, b.y - 60);
                    }
                    if (Date.now() - timeStart < 30000 && combo >= 1) {
                        showMessage('首次快乐！', 300, 150);
                    }
                    return true;
                }
            }
            combo = Math.max(0, combo - 2);
            updateUI();
            return false;
        }

        function updateUI() {
            document.getElementById('ui').textContent = `分数: ${score}`;
            document.getElementById('combo').textContent = `Combo: ${combo}x`;
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;
            checkClick(clickX, clickY);
        });

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            balls.forEach(b => { b.update(); b.draw(); });
            particles = particles.filter(p => {
                p.update();
                p.draw();
                return p.life > 0;
            });
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            balls = []; particles = [];
            score = 0; combo = 0; timeStart = Date.now();
            updateUI();
            for (let i = 0; i < 10; i++) spawnBall();
            setInterval(spawnBall, 600);
            gameLoop();
        }

        function restart() {
            startGame();
        }

        window.onload = () => {
            startGame();
            setTimeout(() => {
                if (score < 100) showMessage('点击连击！30秒内爽起来', 150, 200);
            }, 800);
        };
    </script>
</body>
</html>
